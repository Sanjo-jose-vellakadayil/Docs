<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driver Sign In | VandiPilot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFBF5">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/driver/driver.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
</head>
<body>
<main class="login">
  <div class="login__card">
    <a class="logo" href="/">Vandi<span>Pilot</span></a>
    <h1>Driver sign in</h1>
    <p>Sign in with the Google account your VandiPilot admin approved.</p>

    <div id="msg" class="banner" role="alert" hidden></div>

    <button id="googleBtn" class="btn btn--google btn--block btn--lg" type="button">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>

    <p class="login__foot">Not on the driver list yet? Send your Gmail address to the VandiPilot admin.</p>
  </div>
</main>

<script type="module">
import { getApi } from '/driver/api.js';

const msg = document.getElementById('msg');
const btn = document.getElementById('googleBtn');
const show = (text, kind = 'error') => { msg.textContent = text; msg.className = `banner banner--${kind}`; msg.hidden = false; };

const reasons = {
  'not-approved': 'This Google account is not on the VandiPilot driver list. Ask the admin to add your Gmail address, then sign in again.',
  'inactive': 'Your driver account is not active. Please contact the VandiPilot admin.',
  'signed-out': 'You have signed out.',
};
const reason = new URLSearchParams(location.search).get('reason');
if (reasons[reason]) show(reasons[reason], reason === 'signed-out' ? 'info' : 'error');

let api = null;
try { api = getApi(); } catch (e) { show('Could not load sign-in. Check your connection and refresh the page.'); }
if (!api) {
  btn.disabled = true;
  if (msg.hidden) show('Sign-in is not set up yet (Supabase details missing in driver/config.js).', 'warn');
} else {
  const session = await api.getSession().catch(() => null);
  if (session && reason !== 'not-approved' && reason !== 'inactive') location.replace('/driverCalculation/');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await api.signInWithGoogle(`${location.origin}/driverCalculation/`);
    } catch (e) {
      btn.disabled = false;
      show(navigator.onLine ? 'Google sign-in did not start. Please try again.' : 'No internet connection. Connect and try again.');
    }
  });
}
</script>
</body>
</html>
