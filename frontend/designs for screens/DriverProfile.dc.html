<!doctype html>
<html>
<head>

<x-dc>
<helmet>
<style>
:root{
  --color-primary:#0F766E;--color-primary-light:#CCFBF1;
  --color-background:#FFFBF5;--color-surface:#FFFFFF;--color-foreground:#1A1A2E;
  --color-foreground-muted:#475569;--color-foreground-subtle:#64748B;
  --color-border:#E2E8F0;--color-muted:#F1F5F9;--color-destructive:#B91C1C;
  --gradient-cta:linear-gradient(135deg,#0F766E 0%,#10827A 100%);
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-pill:9999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{background:var(--color-background);}
body{margin:0;color:var(--color-foreground);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;}
h1,h2,h3,h4{margin:0;line-height:1.2;}
p{margin:0;}
a{color:var(--color-primary);text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
button{font-family:inherit;cursor:pointer;}

.shell{display:flex;min-height:100vh;}
.sidebar{width:264px;flex-shrink:0;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;padding:var(--space-5) 0;}
.sidebar__logo{font-size:1.25rem;font-weight:700;padding:0 var(--space-5) var(--space-6);}
.sidebar__logo span{color:var(--color-primary);}
.sidebar__nav{display:flex;flex-direction:column;gap:2px;padding:0 var(--space-3);flex:1;}
.sidebar__link{display:flex;align-items:center;gap:var(--space-3);height:44px;padding:0 var(--space-4);border-radius:var(--radius-md);color:var(--color-foreground-muted);font-size:.9375rem;font-weight:500;position:relative;}
.sidebar__link.active{background:var(--color-primary-light);color:var(--color-primary);}
.sidebar__link.active::before{content:"";position:absolute;left:-12px;top:0;bottom:0;width:3px;background:var(--color-primary);border-radius:0 3px 3px 0;}
.sidebar__foot{padding:var(--space-3) var(--space-3) 0;border-top:1px solid var(--color-border);margin-top:var(--space-3);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:64px;flex-shrink:0;background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-8);}
.topbar h1{font-size:1.5rem;font-weight:600;}
.topbar__right{display:flex;align-items:center;gap:var(--space-5);}
.bell{position:relative;color:var(--color-foreground-muted);}
.bell__badge{position:absolute;top:-4px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--color-destructive);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--color-surface);}
.usermenu{display:flex;align-items:center;gap:var(--space-2);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--color-primary-light);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;}
.usermenu__name{font-size:.875rem;font-weight:500;}
.content{max-width:720px;margin:0 auto;padding:var(--space-8);width:100%;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:44px;padding:0 var(--space-6);border-radius:var(--radius-md);font-size:1rem;font-weight:600;border:none;white-space:nowrap;}
.btn--primary{background:var(--gradient-cta);color:#fff;box-shadow:0 4px 14px rgba(15,118,110,.3);}
.btn--secondary{background:var(--color-surface);color:var(--color-foreground);border:1px solid var(--color-border);}

.profile-head{display:flex;align-items:center;gap:var(--space-5);margin-bottom:var(--space-8);}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--color-primary-light);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.5rem;flex-shrink:0;}
.profile-head h2{font-size:1.375rem;font-weight:700;}
.profile-head p{margin-top:4px;color:var(--color-foreground-muted);font-size:.875rem;}
.photo-tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--color-foreground-subtle);margin-top:8px;}
.rating-pill{display:inline-flex;align-items:center;gap:4px;background:var(--color-primary-light);color:var(--color-primary);padding:3px 10px;border-radius:var(--radius-pill);font-size:.75rem;font-weight:600;margin-top:8px;}

.form-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-8);box-shadow:var(--shadow-sm);}
.group-heading{font-size:1.0625rem;font-weight:600;margin-bottom:var(--space-5);padding-bottom:var(--space-3);border-bottom:1px solid var(--color-border);}
.group-heading:not(:first-child){margin-top:var(--space-8);}
.field{margin-bottom:var(--space-5);}
.field label{display:block;font-size:.875rem;font-weight:500;margin-bottom:var(--space-2);}
.field .opt{color:var(--color-foreground-subtle);font-weight:400;}
.field input,.field select{width:100%;font-family:inherit;font-size:1rem;color:var(--color-foreground);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 var(--space-3);height:48px;}
.field--ro input{background:var(--color-muted);color:var(--color-foreground-muted);}
.field--ro label{display:flex;align-items:center;gap:6px;}
.ro-pill{font-size:.625rem;text-transform:uppercase;letter-spacing:.04em;background:var(--color-muted);color:var(--color-foreground-subtle);padding:2px 6px;border-radius:4px;font-weight:600;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);}
.chip-input{display:flex;flex-wrap:wrap;gap:6px;padding:var(--space-2);border:1px solid var(--color-border);border-radius:var(--radius-sm);min-height:48px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--color-primary-light);color:var(--color-primary);padding:5px 10px;border-radius:var(--radius-pill);font-size:.8125rem;font-weight:500;}
.chip-ghost{display:inline-flex;align-items:center;gap:6px;background:var(--color-surface);color:var(--color-foreground-subtle);border:1px dashed var(--color-border);padding:5px 10px;border-radius:var(--radius-pill);font-size:.8125rem;}
.actions{display:flex;gap:var(--space-3);margin-top:var(--space-6);}
</style>
</helmet>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__logo">Vandi<span>Pilot</span></div>
    <nav class="sidebar__nav">
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Dashboard</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9a3 3 0 010 6H7a3 3 0 000 6h10"/><path d="M9 2v4M9 14v4M4 8h4M4 16h4"/></svg>Earnings</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Calendar</a>
      <a class="sidebar__link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3.2"/><path d="M6 19a6.5 6.5 0 0112 0"/></svg>Profile</a>
    </nav>
    <div class="sidebar__foot">
      <a class="sidebar__link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Sign Out</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1>Profile</h1>
      <div class="topbar__right">
        <div class="bell"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg><span class="bell__badge">1</span></div>
        <div class="usermenu"><div class="avatar">AS</div><span class="usermenu__name">Arun Shankar</span></div>
      </div>
    </header>

    <div class="content">
      <div class="profile-head">
        <div class="profile-avatar">AS</div>
        <div>

          <p>Pilot since Feb 2025 · 142 trips completed</p>
          <span class="rating-pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.8 6.1 6.7.8-5 4.6 1.4 6.5L12 17.2l-5.9 3.3 1.4-6.5-5-4.6 6.7-.8z"/></svg>4.9 average rating</span>
        </div>
      </div>

      <div class="form-card">
        <div class="group-heading">Personal Details</div>
        <div class="field-row">
          <div class="field"><label>Full Name</label><input value="Arun Shankar"></div>
          <div class="field"><label>Phone</label><input value="+91 98765 43210"></div>

          <label>Gmail <span class="ro-pill">Read-only</span></label>

        <div class="field">
          <label>Vehicle Types</label>

            <span class="chip">Sedan <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
            <span class="chip">SUV <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg></span>

        <div class="field">

          <div class="chip-input">

            <span class="chip">Automatic <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg></span>

        <div class="group-heading">Payment &amp; Safety</div>
        <div class="field"><label>Bank Account / UPI ID</label><input value="arun.shankar@upi"></div>

        <div class="field-row">
          <div class="field"><label>Driving License No. <span class="opt">Optional</span></label><input value="KL-07-20180012345"></div>

        </div>

        <div class="actions">
          <a class="btn btn--primary">Save Changes</a>
          <a class="btn btn--secondary">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
