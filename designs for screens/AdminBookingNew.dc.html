<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --color-primary:#0F766E;--color-primary-light:#CCFBF1;
  --color-background:#FFFBF5;--color-surface:#FFFFFF;--color-foreground:#1A1A2E;
  --color-foreground-muted:#475569;--color-foreground-subtle:#64748B;
  --color-border:#E2E8F0;--color-muted:#F1F5F9;--color-destructive:#B91C1C;
  --gradient-cta:linear-gradient(135deg,#0F766E 0%,#10827A 100%);
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-pill:9999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{background:var(--color-background);}
body{margin:0;color:var(--color-foreground);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;}
h1,h2,h3,h4{margin:0;line-height:1.2;}
p{margin:0;}
a{color:var(--color-primary);text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
button{font-family:inherit;cursor:pointer;}

.shell{display:flex;min-height:100vh;}
.sidebar{width:264px;flex-shrink:0;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;padding:var(--space-5) 0;}
.sidebar__logo{font-size:1.25rem;font-weight:700;padding:0 var(--space-5) var(--space-6);}
.sidebar__logo span{color:var(--color-primary);}
.sidebar__nav{display:flex;flex-direction:column;gap:2px;padding:0 var(--space-3);flex:1;}
.sidebar__link{display:flex;align-items:center;gap:var(--space-3);height:44px;padding:0 var(--space-4);border-radius:var(--radius-md);color:var(--color-foreground-muted);font-size:.9375rem;font-weight:500;position:relative;}
.sidebar__link.active{background:var(--color-primary-light);color:var(--color-primary);}
.sidebar__link.active::before{content:"";position:absolute;left:-12px;top:0;bottom:0;width:3px;background:var(--color-primary);border-radius:0 3px 3px 0;}
.sidebar__foot{padding:var(--space-3) var(--space-3) 0;border-top:1px solid var(--color-border);margin-top:var(--space-3);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:64px;flex-shrink:0;background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-8);}
.topbar h1{font-size:1.5rem;font-weight:600;}
.topbar__crumb{font-size:.75rem;color:var(--color-foreground-subtle);margin-top:2px;}
.topbar__right{display:flex;align-items:center;gap:var(--space-5);}
.bell{position:relative;color:var(--color-foreground-muted);}
.bell__badge{position:absolute;top:-4px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--color-destructive);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--color-surface);}
.usermenu{display:flex;align-items:center;gap:var(--space-2);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--color-primary-light);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;}
.usermenu__name{font-size:.875rem;font-weight:500;}
.content{max-width:640px;margin:0 auto;padding:var(--space-8);width:100%;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:44px;padding:0 var(--space-6);border-radius:var(--radius-md);font-size:1rem;font-weight:600;border:none;white-space:nowrap;}
.btn--primary{background:var(--gradient-cta);color:#fff;box-shadow:0 4px 14px rgba(15,118,110,.3);}
.btn--secondary{background:var(--color-surface);color:var(--color-foreground);border:1px solid var(--color-border);}

.form-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-8);box-shadow:var(--shadow-sm);}
.group-heading{font-size:1.0625rem;font-weight:600;margin-bottom:var(--space-5);padding-bottom:var(--space-3);border-bottom:1px solid var(--color-border);}
.group-heading:not(:first-child){margin-top:var(--space-8);}
.toggle-group{display:inline-flex;background:var(--color-muted);border-radius:var(--radius-md);padding:3px;margin-bottom:var(--space-5);}
.toggle-btn{height:36px;padding:0 var(--space-5);border-radius:6px;font-size:.875rem;font-weight:500;color:var(--color-foreground-muted);}
.toggle-btn.active{background:var(--color-surface);color:var(--color-foreground);box-shadow:var(--shadow-sm);}
.field{margin-bottom:var(--space-5);}
.field label{display:block;font-size:.875rem;font-weight:500;margin-bottom:var(--space-2);}
.field .req{color:var(--color-destructive);}
.field input,.field select{width:100%;font-family:inherit;font-size:1rem;color:var(--color-foreground);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 var(--space-3);height:48px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);}
.inline-panel{background:var(--color-muted);border-radius:var(--radius-md);padding:var(--space-5);margin-bottom:var(--space-2);}
.inline-panel__label{font-size:.8125rem;font-weight:600;color:var(--color-foreground-muted);margin-bottom:var(--space-4);display:flex;align-items:center;gap:6px;}
.actions{display:flex;gap:var(--space-3);margin-top:var(--space-6);}
</style>
</helmet>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__logo">Vandi<span>Pilot</span></div>
    <nav class="sidebar__nav">
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Dashboard</a>
      <a class="sidebar__link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 3h6l2-3h4"/><path d="M5 12L3 6a1 1 0 011-1h16a1 1 0 011 1l-2 6"/><path d="M3 12v6a1 1 0 001 1h16a1 1 0 001-1v-6"/></svg>Bookings</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h16M4 16l1.7-6.3A2.4 2.4 0 018 8h8a2.4 2.4 0 012.3 1.7L20 16M4 16v2.5M20 16v2.5"/><circle cx="7" cy="13" r="1.1"/><circle cx="17" cy="13" r="1.1"/></svg>Drivers</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3.2"/><path d="M6 19a6.5 6.5 0 0112 0"/></svg>Customers</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9a3 3 0 010 6H7a3 3 0 000 6h10"/><path d="M9 2v4M9 14v4M4 8h4M4 16h4"/></svg>Commissions</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Reports</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg>Pricing</a>
      <a class="sidebar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.8 6.1 6.7.8-5 4.6 1.4 6.5L12 17.2l-5.9 3.3 1.4-6.5-5-4.6 6.7-.8z"/></svg>Ratings</a>
    </nav>
    <div class="sidebar__foot">
      <a class="sidebar__link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Sign Out</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div><h1>New Booking</h1><div class="topbar__crumb">Bookings / New</div></div>
      <div class="topbar__right">
        <div class="bell"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg><span class="bell__badge">5</span></div>
        <div class="usermenu"><div class="avatar">SJ</div><span class="usermenu__name">Sanjay (Admin)</span></div>
      </div>
    </header>

    <div class="content">
      <div class="form-card">
        <div class="group-heading">Customer</div>
        <div class="toggle-group">
          <div class="toggle-btn">Existing Customer</div>
          <div class="toggle-btn active">New Customer</div>
        </div>
        <div class="inline-panel">
          <div class="inline-panel__label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create customer inline</div>
          <div class="field-row">
            <div class="field" style="margin-bottom:0"><label>Full Name <span class="req">*</span></label><input placeholder="e.g. Vinod Pillai"></div>
            <div class="field" style="margin-bottom:0"><label>Phone <span class="req">*</span></label><input placeholder="+91 90000 00000"></div>
          </div>
          <div class="field" style="margin-top:var(--space-5);margin-bottom:0"><label>Email (Gmail)</label><input placeholder="name@gmail.com"></div>
        </div>

        <div class="group-heading">Trip Details</div>
        <div class="field"><label>Pickup Location <span class="req">*</span></label><input placeholder="Enter pickup address"></div>
        <div class="field"><label>Destination <span class="req">*</span></label><input placeholder="Enter destination"></div>
        <div class="field-row">
          <div class="field"><label>Date <span class="req">*</span></label><input placeholder="Select date"></div>
          <div class="field"><label>Time <span class="req">*</span></label><select><option>Select time slot</option></select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Car Type</label><select><option>Sedan</option></select></div>
          <div class="field"><label>Transmission</label><select><option>Automatic</option></select></div>
        </div>

        <div class="actions">
          <a class="btn btn--primary">Create Booking</a>
          <a class="btn btn--secondary">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
